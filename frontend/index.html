<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=1280" />
    <meta name="theme-color" content="#4F46E5" />
    <title>RungtaStudentXchange</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applies the correct theme class before React mounts / before
      // first paint, so switching themes never flashes the wrong
      // theme. Reads from sessionStorage (not localStorage) so the
      // theme always resets to light when the browser is closed and
      // reopened, but stays consistent during the current session.
      // Mirrors the exact logic in src/store/themeStore.js +
      // src/components/theme/ThemeProvider.jsx — update together if
      // the storage key or shape ever changes.
      (function () {
        try {
          var STORAGE_KEY = "rsx-theme";
          var stored = sessionStorage.getItem(STORAGE_KEY);
          var preference = stored ? JSON.parse(stored).state.theme : "light";
          var resolved =
            preference === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : preference;
          if (resolved === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          // sessionStorage unavailable or malformed — fall back
          // silently to the light theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
